<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location Security Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f4f6f8;
    }

    .box {
      max-width: 420px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 20px #ccc;
    }

    button {
      padding: 14px 25px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>📍 Location Security Demo</h2>

    <p>
      This is a safe cybersecurity demonstration.
    </p>

    <button onclick="getLocation()">
      Share My Location
    </button>

    <div id="result"></div>

  </div>

<script>

function getLocation() {

  const result = document.getElementById("result");

  if (!navigator.geolocation) {

    result.innerHTML =
      "❌ Location is not supported by this browser.";

    return;
  }

  result.innerHTML =
    "⏳ Requesting location permission...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      result.innerHTML =
        "✅ Location permission granted!<br><br>" +
        "Latitude: " + latitude + "<br>" +
        "Longitude: " + longitude + "<br>" +
        "Accuracy: approximately " +
        Math.round(accuracy) + " meters";

    },

    function(error) {

      result.innerHTML =
        "❌ Location permission was denied or unavailable.";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );
}

</script>

</body>
</html>
